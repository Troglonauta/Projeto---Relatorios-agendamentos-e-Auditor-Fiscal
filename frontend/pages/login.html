<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acesso Restrito — Fertimaxi Reports</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-header">
        <img src="/static/img/logo.png" alt="Fertimaxi" class="logo"
             onerror="this.style.display='none'">
        <h1>Acesso Restrito</h1>
        <small>Protheus Reports · Fertimaxi</small>
      </div>
      <form id="loginForm" class="login-body" novalidate>
        <div id="alertBox"></div>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input id="username" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnLogin">
          <span class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
          <span class="label">Entrar</span>
        </button>
      </form>
      <div class="login-footer">
        <a href="#" id="forgotLink" class="text-decoration-none">Esqueci a senha</a>
      </div>
    </div>
  </div>

  <!-- Modal: esqueci a senha -->
  <div class="modal fade" id="forgotModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="forgotForm">
        <div class="modal-header">
          <h5 class="modal-title">Recuperar senha</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">
            Informe o e-mail cadastrado. Enviaremos uma senha temporária.
            Você precisará trocá-la no próximo login.
          </p>
          <input id="forgotEmail" type="email" class="form-control" required placeholder="seu.email@fertimaxi.com.br">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
