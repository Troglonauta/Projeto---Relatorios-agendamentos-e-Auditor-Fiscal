<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Trocar senha — Fertimaxi Reports</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-header">
        <img src="/static/img/logo.png" alt="Fertimaxi" class="logo"
             onerror="this.style.display='none'">
        <h1>Trocar Senha</h1>
        <small id="ctxLabel">Defina uma nova senha</small>
      </div>
      <form id="cpForm" class="login-body" novalidate>
        <div id="alertBox"></div>
        <div class="mb-3">
          <label class="form-label">Senha atual</label>
          <input id="curPwd" type="password" class="form-control" required autocomplete="current-password">
        </div>
        <div class="mb-3">
          <label class="form-label">Nova senha</label>
          <input id="newPwd" type="password" class="form-control" required minlength="8" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar nova senha</label>
          <input id="newPwd2" type="password" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnSave">
          <span class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
          <span class="label">Salvar</span>
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { api, auth, requireAuth, withSpinner, landingPage } from "../js/api.js";
    if (!requireAuth()) {}

    const params = new URLSearchParams(location.search);
    if (params.get("first")) {
      document.getElementById("ctxLabel").textContent = "Você precisa trocar sua senha temporária";
    }

    const alertBox = document.getElementById("alertBox");
    document.getElementById("cpForm").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("btnSave");
      await withSpinner(btn, async () => {
        const a = document.getElementById("curPwd").value;
        const b = document.getElementById("newPwd").value;
        const c = document.getElementById("newPwd2").value;
        if (b !== c) { alertBox.innerHTML = `<div class="alert alert-danger small">Senhas não conferem.</div>`; return; }
        try {
          await api("/api/auth/change-password", { method: "POST",
            body: { current_password: a, new_password: b } });
          location.href = landingPage();
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-danger small">${err.message}</div>`;
        }
      }, "Salvando…");
    });
  </script>
</body>
</html>
